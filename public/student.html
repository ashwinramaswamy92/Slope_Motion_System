<!-- public/student.html -->
 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student – Slope Walker</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/student.css">
  <link rel="stylesheet" href="metronome/metronome.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>Slope Walker</h1>
    <h2>Click the start button to create your motion graph!</h2>

    <div style="background-color: rgb(45, 51, 107); padding: 10px; border-radius: 10px; margin: 5px;" id="head">
      <div id="dataCount" style="display: none">Data Points:</div>
      <div id="classroomInput">
        <input type="text" id="classroomCode" placeholder="Enter Classroom Code">
        <button id="joinButton" style="margin-left: 20px;">Join Classroom</button>
      </div>
      <h3 style="display: none; color: whitesmoke;" id="connectionStatus"></h3>
      <h3 style="display: none; color: whitesmoke;" id="connectionError"></h3>
    </div>

    <!-- Acceleration chart -->
    <div class="chart-container">
      <div id="countdown"></div>
      <canvas id="myChart"></canvas>
    </div>

    <!-- Steps chart (hidden at first) -->
    <div style="display: none" id="steps-class" class="chart-container">
      <h3>Steps over Time Graph:</h3>
      <canvas id="stepsChart"></canvas>
    </div>

    <div class="center-container">
      <input type="number" id="yMaxInput" placeholder="Enter max value for Y-axis">
    </div>

    <div id="stepCount" style="display: none">Step Count: 0</div>

    <div class="button-container">
      <button id="startButton">Start Collecting Data for 30s</button>
      <button id="sendButton">Send Data</button>
      <button id="refreshDataButton">Refresh Data</button>
    </div>

    <!-- Metronome block -->
    <div class="metronome-container" id="metronome-container">
      <!-- The metronome UI will be injected by metronome.js -->
    </div>
  </div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
