<!-- public/login.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      background: url('assets/images/Blue.jpeg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-container {
      background-color: rgba(45, 51, 107, 0.726);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      color: white;
      font-size: 26px;
      font-weight: bold;
    }
    button {
      background-color: rgb(169, 181, 223);
      color: black;
      border: none;
      font-size: 20px;
      padding: 10px 20px;
      margin: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: rgb(120, 134, 199);
    }
    #password-popup {
      display: none;
      color: white;
      font-size: 24px;
      font-weight: bold;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }
    #popup {
      background-color: rgba(45, 51, 107, 0.97);
      padding: 60px;
      border-radius: 20px;
      text-align: center;
    }
    @media (max-width: 768px) {
      #Teacher_btn { display: none; }
      .login-container { padding: 20px; font-size: 20px; }
      button { font-size: 16px; padding: 8px 16px; }
      #popup { padding: 30px; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Select Mode</h1>
    <button onclick="openMode('student')">Student Mode</button>
    <button id="Teacher_btn" onclick="openMode('teacher')">Teacher Mode</button>
  </div>
  <div id="password-popup">
    <div id="popup">
      <h2>Enter Password</h2>
      <input type="password" id="password-input" style="padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc;">
      <p id="password-message" style="height:20px;"></p>
      <button onclick="checkPassword()">Submit</button>
      <button onclick="closePopup()">Cancel</button>
    </div>
  </div>
  <script>
    // Utility function to flash the background color
    function flashColor(color, duration, callback) {
      const originalColor = document.body.style.backgroundColor;
      document.body.style.backgroundColor = color;
      setTimeout(function() {
        document.body.style.backgroundColor = originalColor;
        if (callback) callback();
      }, duration);
    }

    function openMode(mode) {
      if (mode === 'teacher') {
        document.getElementById('password-input').value = '';
        document.getElementById('password-message').textContent = '';
        document.getElementById('password-popup').style.display = 'flex';
      } else {
        window.location.href = 'student.html';
      }
    }

    function checkPassword() {
      let password = document.getElementById('password-input').value;
      let messageEl = document.getElementById('password-message');
      if (password === 'admin123') {
        messageEl.style.color = 'white';
        messageEl.textContent = 'Correct password!';
        flashColor('lightgreen', 500, function() {
          window.location.href = 'teacher.html';
        });
      } else {
        messageEl.style.color = 'white';
        messageEl.textContent = 'Incorrect password!';
        flashColor('lightcoral', 500, function() {
          document.getElementById('password-input').value = '';
        });
      }
    }

    function closePopup() {
      document.getElementById('password-popup').style.display = 'none';
    }
  </script>
</body>
</html>
