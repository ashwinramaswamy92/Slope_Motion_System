<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>User Screen</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="user.js"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      .metronome-container {
        padding: 10px 50px;
        background-color: rgba(45, 51, 107, 0.9);
        margin-top: 20px;
        border-radius: 20px;
        border: 3px solid white;
        text-align: center;
        max-width: 350px;
        margin-left: auto;
        margin-right: auto;
      }

      /* Put input + buttons in one row */
      .metronome-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      .metronome-controls input {
        width: 100px;
        text-align: center;
        border-radius: 5px;
        border: none;
        padding: 4px;
        font-size: 30px;
      }

      .metronome-controls button {
        padding: 4px 10px;
        border-radius: 5px;
        background-color: white;
        border: none;
        cursor: pointer;
        font-weight: normal; /* ✅ removed bold */
        font-size: 30px; /* ✅ same size as input */
      }

      /* Metronome animation container */
      #metronome-animation {
        position: relative;
        width: 180px;
        height: 180px;
        margin: 0 auto;
      }

      /* Triangular body */
      #triangle-body {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        border-left: 90px solid transparent;
        border-right: 90px solid transparent;
        border-bottom: 180px solid rgb(120, 134, 199);
      }

      /* Swinging pendulum */
      .pendulum {
        width: 8px;
        height: 110px;
        border-radius: 4px;
        background-color: rgb(15, 54, 83);
        position: absolute;
        bottom: 45px;
        left: calc(50% - 4px);
        transform-origin: bottom center;
        animation: swing var(--swing-duration, 1s) ease-in-out infinite;
        border: 2px solid white;
      }

      @keyframes swing {
        0%   { transform: rotate(-20deg); }
        50%  { transform: rotate(20deg); }
        100% { transform: rotate(-20deg); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Slippery Slope</h1>
      <h2>click the start button to create your motion graph!</h2>
      <div
        style="background-color: rgb(45, 51, 107); padding: 10px; border-radius: 10px; margin: 5px;"
        id="head"
      >
        <div id="countdown" style="font-size: 24px; font-weight: bold; display: none;"></div>
        <div id="dataCount" style="display: none">Data Points:</div>
        <div id="classroomInput">
          <input type="text" id="classroomCode" placeholder="Enter Classroom Code" />
          <button id="joinButton" style="margin-left: 20px;">Join Classroom</button>
        </div>
        <h3 style="display: none;color:whitesmoke;" id="connectionStatus"></h3>
        <h3 style="display: none;color:whitesmoke;" id="connectionError"></h3>
      </div>

      <div class="chart-container">
        <canvas id="myChart"></canvas>
      </div>

      <div style="display: none" id="steps-class" class="chart-container">
        <h3>Steps over Time Graph:</h3>
        <canvas id="stepsChart"></canvas>
      </div>

      <div class="center-container">
        <input type="number" id="yMaxInput" placeholder="Enter max value for Y-axis" />
      </div>

      <div id="stepCount" style="display: none">Step Count: 0</div>
      <div class="button-container">
        <button id="startButton">Start Collecting Data for 30s</button>
        <button id="sendButton">Send Data</button>
        <button id="refreshDataButton">Refresh Data</button>
      </div>

      <!-- 🔽 Metronome Box -->
      <div class="metronome-container">
        <div class="metronome-controls">
          <label for="bpm-input" style="color:white;font-size: 30px;">BPM:</label>
          <input type="number" id="bpm-input" min="40" max="200" value="60" />
          <button id="start-btn">Start</button>
          <button id="stop-btn">Stop</button>
        </div>

        <div id="metronome-animation">
          <div id="triangle-body"></div>
          <div class="pendulum"></div>
        </div>
      </div>
    </div>

    <script>
      const bpmInput = document.getElementById("bpm-input");
      const startBtn = document.getElementById("start-btn");
      const stopBtn = document.getElementById("stop-btn");
      let intervalId = null;
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();

      function playBeep() {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        gainNode.gain.setValueAtTime(0.4, audioContext.currentTime);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.15);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
      }

      function startMetronome() {
        if (intervalId) return;
        const bpm = parseInt(bpmInput.value) || 60;
        const interval = 60000 / bpm;
        document.documentElement.style.setProperty("--swing-duration", (60 / bpm) + "s");
        audioContext.resume();
        intervalId = setInterval(playBeep, interval);
      }

      function stopMetronome() {
        clearInterval(intervalId);
        intervalId = null;
      }

      startBtn.addEventListener("click", startMetronome);
      stopBtn.addEventListener("click", stopMetronome);
      bpmInput.addEventListener("input", () => {
        const bpm = Math.min(Math.max(parseInt(bpmInput.value) || 60, 40), 200);
        bpmInput.value = bpm;
        document.documentElement.style.setProperty("--swing-duration", (60 / bpm) + "s");
        if (intervalId) {
          stopMetronome();
          startMetronome();
        }
      });
    </script>
  </body>
</html>
